name: Update HEX White-List Auto Select

on:
  push:
    paths:
      - ".github/workflows/sync-whitelist.yml"
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hex-whitelist-autoselect
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and validate Happ white-list auto-select
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 5 \
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/Export/Happ/GLOBAL/Vless-Reality-White-Lists-Rus-Mobile-Happ-global.json" \
            --output upstream-whitelist.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("upstream-whitelist.json")
          cfg = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(cfg, dict):
              raise SystemExit("Expected a single Happ/Xray config object")
          outbounds = cfg.get("outbounds", [])
          nodes = [
              x for x in outbounds
              if x.get("protocol") in ("vless", "trojan", "hysteria")
              and str(x.get("tag", "")).startswith("igareck-node-")
          ]
          vless_count = sum(x.get("protocol") == "vless" for x in nodes)
          hysteria_count = sum(x.get("protocol") == "hysteria" for x in nodes)
          trojan_count = sum(x.get("protocol") == "trojan" for x in nodes)
          balancer = next(
              (x for x in cfg.get("routing", {}).get("balancers", [])
               if x.get("tag") == "igareck-auto"
               and x.get("strategy", {}).get("type") == "leastPing"),
              None
          )
          if len(nodes) < 20:
              raise SystemExit(f"Refusing update: only {len(nodes)} proxy nodes")
          if not balancer:
              raise SystemExit("Refusing update: leastPing auto-selector missing")
          if not any(x.get("tag") == "socks-in" for x in cfg.get("inbounds", [])):
              raise SystemExit("Refusing update: Happ SOCKS inbound missing")

          # Replace upstream numeric tags with readable HEX labels while preserving routing.
          tag_prefix = "⚪ HEX | БС | Узел "
          tag_map = {}

          def alpha_label(number):
              # Excel-style labels: A..Z, AA..AZ, BA..; never numeric-only.
              result = ""
              while number:
                  number, remainder = divmod(number - 1, 26)
                  result = chr(65 + remainder) + result
              return result

          for outbound in cfg.get("outbounds", []):
              old_tag = str(outbound.get("tag", ""))
              if old_tag.startswith("igareck-node-"):
                  new_tag = f"{tag_prefix}{alpha_label(len(tag_map) + 1)}"
                  tag_map[old_tag] = new_tag
                  outbound["tag"] = new_tag
          if not tag_map:
              raise SystemExit("Refusing update: no upstream node tags found")

          for balancer_item in cfg.get("routing", {}).get("balancers", []):
              if balancer_item.get("tag") == "igareck-auto":
                  old_fallback = balancer_item.get("fallbackTag")
                  balancer_item["selector"] = [tag_prefix]
                  balancer_item["fallbackTag"] = tag_map.get(old_fallback, next(iter(tag_map.values())))
          observatory = cfg.setdefault("observatory", {})
          observatory["subjectSelector"] = [tag_prefix]
          observatory["probeUrl"] = "https://www.google.com/generate_204"
          observatory.pop("probeURL", None)
          observatory["probeInterval"] = "1m"
          observatory["enableConcurrency"] = True

          cfg.setdefault("_meta", {})
          cfg["_meta"]["name"] = "⚪ HEX | АВТО БС"
          cfg["_meta"]["generator"] = "HEX VPN • upstream Igareck"
          cfg["_meta"]["notes"] = [
              f"{len(nodes)} proxies ({vless_count} VLESS + {hysteria_count} Hysteria + {trojan_count} Trojan)",
              "Happ GLOBAL auto-select • leastPing • 1-minute health probes",
              "Source: igareck/vpn-configs-for-russia • mobile CIDR white-list feed"
          ]
          cfg["remarks"] = "⚪ HEX | АВТО БС"
          cfg.setdefault("meta", {})["serverDescription"] = "HEX VPN • автоматический выбор по минимальному пингу"
          Path("whitelist-autoselect.json").write_text(
              json.dumps(cfg, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print(f"Validated {len(nodes)} proxies ({vless_count} VLESS + {hysteria_count} Hysteria + {trojan_count} Trojan) and leastPing balancer.")
          PY

      - name: Build manual selectable white-list subscription
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 5 \
            "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/Vless-Reality-White-Lists-Rus-Mobile.txt" \
            --output upstream-whitelist.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import quote, unquote, urlsplit

          translations = {
              "Austria": "Австрия", "Germany": "Германия", "Russia": "Россия",
              "United States": "США", "United States of America": "США",
              "Netherlands": "Нидерланды", "Sweden": "Швеция", "Finland": "Финляндия",
              "Poland": "Польша", "France": "Франция", "United Kingdom": "Великобритания",
              "Canada": "Канада", "Japan": "Япония", "Singapore": "Сингапур",
              "Turkey": "Турция", "Switzerland": "Швейцария", "Italy": "Италия",
              "Spain": "Испания", "Romania": "Румыния", "Ukraine": "Украина",
              "Belgium": "Бельгия", "Czechia": "Чехия", "Denmark": "Дания",
              "Estonia": "Эстония", "Norway": "Норвегия", "Latvia": "Латвия",
              "Lithuania": "Литва", "Ireland": "Ирландия", "Portugal": "Португалия",
              "Brazil": "Бразилия", "Australia": "Австралия"
          }
          counts = {}
          seen = set()
          generic = 0
          output = [
              "#profile-title: ⚪ HEX | БС",
              "#profile-update-interval: 1",
              "#support-url: https://t.me/amvkm",
              "#profile-web-page-url: https://github.com/e6asos/HEX-VPN"
          ]

          for raw_line in Path("upstream-whitelist.txt").read_text(encoding="utf-8").splitlines():
              line = raw_line.strip()
              if not line.startswith("vless://"):
                  continue
              uri = line.split("#", 1)[0]
              if uri in seen:
                  continue
              try:
                  parsed = urlsplit(uri)
                  if not parsed.hostname or not parsed.port or not 1 <= parsed.port <= 65535:
                      continue
              except ValueError:
                  continue
              seen.add(uri)
              old_name = unquote(line.split("#", 1)[1]) if "#" in line else ""
              old_name = re.sub(r"\[\*?CIDR\]", "", old_name, flags=re.I)
              old_name = re.sub(r"\s*\|\s*", " ", old_name).strip()
              country = next((name for name in translations if name in old_name), None)
              if country:
                  counts[country] = counts.get(country, 0) + 1
                  flag = "".join(re.findall(r"[\U0001F1E6-\U0001F1FF]{2}", old_name)[:1])
                  label = f"⚪ HEX | БС | {flag} {translations[country]} {counts[country]:02d}"
              else:
                  generic += 1
                  label = f"⚪ HEX | БС | Узел {generic:02d}"
              output.append(uri + "#" + quote(label, safe=""))

          if len(output) - 4 < 20:
              raise SystemExit(f"Refusing update: only {len(output) - 4} manual configs")
          Path("whitelist.txt").write_text("\n".join(output) + "\n", encoding="utf-8")
          print(f"Built {len(output) - 4} manually selectable white-list configs.")
          PY
          rm -f upstream-whitelist.txt

      - name: Publish updated profile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add whitelist-autoselect.json whitelist.txt
          if git diff --cached --quiet; then
            echo "No upstream changes."
            exit 0
          fi
          git commit -m "Update HEX White-List Auto Select"
          git push
