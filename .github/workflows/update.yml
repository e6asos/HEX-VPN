name: Update HEX VPN

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hex-vpn-subscription
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download hourly HTTP-verified feed
        run: |
          curl --fail --location --retry 3 --retry-delay 5 \
            "https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/v2ray-base64.txt" \
            --output upstream.b64

      - name: Build balanced HEX VPN list
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          raw = Path("upstream.b64").read_bytes()
          decoded = base64.b64decode(b"".join(raw.split())).decode("utf-8", errors="strict")
          protocols = ("vless", "vmess", "trojan", "ss", "hy2")
          selected = []
          seen = set()

          for protocol in protocols:
              candidates = []
              for line in decoded.splitlines():
                  line = line.strip()
                  if not line.lower().startswith(protocol + "://"):
                      continue
                  uri = line.split("#", 1)[0]
                  if any(ch.isspace() for ch in uri) or uri in seen:
                      continue
                  candidates.append(uri)
              if len(candidates) < 4:
                  raise SystemExit(f"Only {len(candidates)} {protocol} configs; refusing to publish.")
              for uri in candidates[:4]:
                  seen.add(uri)
                  selected.append(uri)

          if len(selected) != 20:
              raise SystemExit(f"Expected 20 unique configs, got {len(selected)}.")

          output = [
              "#profile-title: HEX VPN",
              "#profile-update-interval: 1",
              "#support-url: https://t.me/amvkm",
          ]
          for number, uri in enumerate(selected, 1):
              output.append(f"{uri}#HEX%20%7C%20Server%20{number:02d}")

          Path("subscription.txt").write_text("\n".join(output) + "\n", encoding="utf-8")
          print("Published 20 upstream HTTP-verified configs: 4 each from VLESS, VMess, Trojan, Shadowsocks and Hysteria2.")
          PY
          rm upstream.b64

      - name: Commit subscription if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subscription.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update HEX VPN verified nodes"
            git push
          else
            echo "Subscription is already up to date."
          fi
