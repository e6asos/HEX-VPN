name: Update HEX VPN

on:
  push:
    paths:
      - ".github/workflows/update.yml"
      - "scripts/build_autoselect.py"
      - "scripts/test_nodes.py"
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hex-vpn-subscription
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download public community node feed
        run: |
          curl --fail --location --retry 3 --retry-delay 5 \
            "https://radarhub.top/v2ray.txt" \
            --output upstream.b64
          curl --fail --location --retry 3 --retry-delay 5 \
            "https://raw.githubusercontent.com/TelegaVPN/free-vpn-keys/main/sub/base64/all.txt" \
            --output quality.b64

      - name: Build HEX VPN from public feed
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, re, urllib.parse, urllib.request
          from pathlib import Path

          decoded = "\n".join(
              base64.b64decode(b"".join(Path(filename).read_bytes().split()), validate=True).decode("utf-8", errors="strict")
              for filename in ("quality.b64", "upstream.b64")
          )
          allowed = {"vless", "vmess", "trojan", "ss", "hysteria2", "hy2", "tuic"}
          entries, seen, hosts = [], set(), []

          for line in decoded.splitlines():
              line = line.strip()
              if not line or "://" not in line:
                  continue
              scheme = line.split("://", 1)[0].lower()
              if scheme not in allowed:
                  continue
              uri = line.split("#", 1)[0]
              if uri in seen:
                  continue
              try:
                  if scheme == "vmess":
                      payload = uri.split("://", 1)[1]
                      payload += "=" * (-len(payload) % 4)
                      data = json.loads(base64.b64decode(payload).decode("utf-8"))
                      host = data.get("add", "")
                  else:
                      host = urllib.parse.urlsplit(uri).hostname or ""
                  if not host or any(c.isspace() for c in host):
                      continue
              except Exception:
                  continue
              seen.add(uri)
              entries.append(uri)
              hosts.append(host)
              if len(entries) == 1000:
                  break

          if len(entries) < 20:
              raise SystemExit(f"Only {len(entries)} stable unique configs; refusing to publish.")

          # Country labels are best-effort GeoIP metadata; never alter connection credentials.
          countries = {}
          try:
              # ip-api batch accepts at most 100 hosts per request.
              for offset in range(0, len(hosts), 90):
                  batch = hosts[offset:offset + 90]
                  req = urllib.request.Request(
                      "http://ip-api.com/batch?fields=status,country,countryCode,query",
                      data=json.dumps([{"query": h} for h in batch]).encode(),
                      headers={"Content-Type": "application/json", "User-Agent": "HEX-VPN-updater"},
                      method="POST",
                  )
                  with urllib.request.urlopen(req, timeout=25) as response:
                      geo = json.loads(response.read().decode())
                  for item in geo:
                      if item.get("status") == "success":
                          countries[item.get("query", "")] = (item.get("country", ""), item.get("countryCode", ""))
              print(f"GeoIP resolved countries for {len(countries)}/{len(set(hosts))} unique endpoints.")
          except Exception as exc:
              print(f"GeoIP lookup partially unavailable; unresolved nodes will use neutral labels: {exc}")

          flags = {}
          for code in "ABCDEFGHIJKLMNOPQRSTUVWXYZ":
              flags[code] = chr(0x1F1E6 + ord(code) - ord("A"))

          def flag(code):
              return "".join(flags.get(c, "") for c in code.upper()) if len(code) == 2 else ""

          output = [
              "#profile-title: HEX VPN",
              "#profile-update-interval: 1",
              "#support-url: https://t.me/amvkm",
              "#profile-web-page-url: https://github.com/e6asos/HEX-VPN",
          ]
          counts = {}
          country_names = {
              "Germany": "Германия", "Netherlands": "Нидерланды", "France": "Франция",
              "Sweden": "Швеция", "United Kingdom": "Великобритания",
              "United States": "США", "United States of America": "США",
              "Finland": "Финляндия", "Poland": "Польша", "Switzerland": "Швейцария",
              "Canada": "Канада", "Japan": "Япония", "Singapore": "Сингапур",
              "Turkey": "Турция", "Russia": "Россия", "Austria": "Австрия",
              "Belgium": "Бельгия", "Czechia": "Чехия", "Czech Republic": "Чехия",
              "Denmark": "Дания", "Estonia": "Эстония", "Spain": "Испания",
              "Italy": "Италия", "Latvia": "Латвия", "Lithuania": "Литва",
              "Norway": "Норвегия", "Romania": "Румыния", "Ukraine": "Украина",
              "Australia": "Австралия", "Brazil": "Бразилия", "Hong Kong": "Гонконг",
              "Ireland": "Ирландия", "Luxembourg": "Люксембург",
              "Moldova": "Молдова", "Portugal": "Португалия",
              "Slovakia": "Словакия", "South Korea": "Южная Корея",
              "Taiwan": "Тайвань", "United Arab Emirates": "ОАЭ",
          }
          for i, (uri, host) in enumerate(zip(entries, hosts), 1):
              country, code = countries.get(host, ("", ""))
              if country:
                  counts[country] = counts.get(country, 0) + 1
                  display_country = country_names.get(country, country)
                  label = f"HEX | {flag(code)} {display_country} {counts[country]:02d}".strip()
              else:
                  label = f"HEX | Сервер {i:02d}"
              output.append(uri + "#" + urllib.parse.quote(label, safe=""))
          Path("subscription.txt").write_text("\n".join(output) + "\n", encoding="utf-8")
          print(f"Published {len(entries)} unique nodes from upstream stable feed.")
          PY
          rm -f upstream.b64 quality.b64

      - name: Remove unsupported and unreachable TCP nodes
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, socket
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from urllib.parse import urlsplit

          path = Path("subscription.txt")
          lines = path.read_text(encoding="utf-8").splitlines()
          headers = [x for x in lines if not x.strip() or x.lstrip().startswith("#")]
          candidates = []
          for line in lines:
              line = line.strip()
              if not line or line.startswith("#") or "://" not in line:
                  continue
              scheme = line.split("://", 1)[0].lower()
              if scheme not in {"vless", "vmess", "trojan", "ss"}:
                  continue
              uri = line.split("#", 1)[0]
              try:
                  if scheme == "vmess":
                      payload = uri.split("://", 1)[1]
                      payload += "=" * (-len(payload) % 4)
                      data = json.loads(base64.urlsafe_b64decode(payload).decode("utf-8"))
                      host, port = data.get("add"), int(data.get("port"))
                  elif scheme == "ss":
                      raw = uri.split("://", 1)[1]
                      if "@" not in raw:
                          raw += "=" * (-len(raw) % 4)
                          raw = base64.urlsafe_b64decode(raw).decode("utf-8")
                      endpoint = raw.rsplit("@", 1)[1].split("?", 1)[0]
                      parsed = urlsplit("ss://" + endpoint)
                      host, port = parsed.hostname, parsed.port
                  else:
                      parsed = urlsplit(uri)
                      host, port = parsed.hostname, parsed.port
                  if host and port and 1 <= int(port) <= 65535:
                      candidates.append((line, host, int(port)))
              except Exception:
                  continue

          def reachable(item):
              line, host, port = item
              try:
                  with socket.create_connection((host, port), timeout=2.5):
                      return line, True
              except Exception:
                  return line, False

          with ThreadPoolExecutor(max_workers=80) as pool:
              results = list(pool.map(reachable, candidates))
          alive = {line for line, ok in results if ok}
          kept = [line for line, host, port in candidates if line in alive]
          dropped = len(candidates) - len(kept)
          if len(kept) < 5:
              raise SystemExit(f"Only {len(kept)} TCP-reachable supported nodes; refusing to publish.")
          path.write_text("\n".join(headers + kept) + "\n", encoding="utf-8")
          print(f"TCP check: {len(kept)} reachable supported nodes kept; {dropped} unreachable/invalid or unsupported nodes removed.")
          PY

      - name: Build single-entry HEX AutoSelect config
        run: python3 scripts/build_autoselect.py subscription.txt autoselect.json

      - name: Prepare individual node tests
        run: python3 scripts/test_nodes.py prepare

      - name: Validate individual Xray node test configuration
        run: docker run --rm -v "$PWD:/config:ro" ghcr.io/xtls/xray-core:26.9.9 run -test -c /config/node-test-config.json

      - name: Test each candidate with real HTTPS
        shell: bash
        run: |
          set -e
          docker run -d --name hex-xray-node-tests --network host \
            -v "$PWD:/config:ro" \
            ghcr.io/xtls/xray-core:26.9.9 run -c /config/node-test-config.json
          trap 'docker logs hex-xray-node-tests 2>&1 | tail -80; docker rm -f hex-xray-node-tests >/dev/null 2>&1 || true' EXIT
          sleep 6
          python3 scripts/test_nodes.py finish
          docker rm -f hex-xray-node-tests >/dev/null
          trap - EXIT

      - name: Validate final AutoSelect with Happ-compatible Xray core
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          configs = json.loads(Path("autoselect.json").read_text(encoding="utf-8"))
          if not isinstance(configs, list) or len(configs) != 1:
              raise SystemExit("Happ AutoSelect must contain exactly one Xray config")
          Path("autoselect-xray-test.json").write_text(
              json.dumps(configs[0], ensure_ascii=False), encoding="utf-8"
          )
          PY
          docker run --rm -v "$PWD:/config:ro" ghcr.io/xtls/xray-core:26.9.9 run -test -c /config/autoselect-xray-test.json

      - name: Commit subscription if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subscription.txt autoselect.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh HEX VPN reachable public nodes"
            git push
          else
            echo "Subscription is already up to date."
          fi
