
name: Update HEX VPN

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download public servers
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/morpheusadam/v2ray-config/main/subs/bundles/best.txt" \
            -o servers.txt

      - name: Build HEX VPN
        run: |
          {
            echo "#profile-title: HEX VPN"
            echo "#profile-update-interval: 6"
            grep -E '^(vless|vmess|trojan|ss|hysteria2|tuic)://' servers.txt
          } > subscription.txt

          test "$(wc -l < subscription.txt)" -gt 2
          rm servers.txt

      - name: Save updated subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subscription.txt

          if ! git diff --cached --quiet; then
            git commit -m "Update HEX VPN servers"
            git push
          fi
